name: deploy

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    container: node:22-alpine
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: food
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: food_os
        options: >-
          --health-cmd "pg_isready -U food -d food_os"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      ADMIN_DATABASE_URL: postgres://food:ci@postgres:5432/food_os
      DATABASE_URL: postgres://food:ci@postgres:5432/food_os
      APP_DATABASE_URL: postgres://food_app_login:ci-app@postgres:5432/food_os
      SYNC_DATABASE_URL: postgres://food_sync:ci-sync@postgres:5432/food_os
      REDIS_URL: redis://redis:6379
      AUTH_JWT_SECRET: ci-only-secret-not-for-production
    steps:
      - uses: actions/checkout@v4
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  e2e:
    needs: test
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci
      APP_DB_PASSWORD: ci-app
    steps:
      - uses: actions/checkout@v4
      - name: Create shared network
        run: bash proxy_server/create-shared-network.sh
      - name: Start stack (base file, built from source)
        run: docker compose -f docker-compose.yml up -d --build --wait
      - name: Migrate, bootstrap app login, seed
        run: |
          docker run --rm --network host -v "$PWD:/app" -w /app \
            -e ADMIN_DATABASE_URL="postgres://food:ci@127.0.0.1:5432/food_os" \
            -e DATABASE_URL="postgres://food:ci@127.0.0.1:5432/food_os" \
            node:22-alpine sh -c "npm ci --no-audit --no-fund && npx tsx scripts/migrate-cli.ts && npx tsx scripts/seed.ts"
          docker exec -i food-os-db psql -U food -d food_os -v ON_ERROR_STOP=1 \
            -v app_password="$APP_DB_PASSWORD" < db/bootstrap/002_app_login.sql
      - name: Playwright
        run: |
          docker run --rm --network shared -v "$PWD:/app" -w /app \
            -e E2E_BASE_URL=http://food-os-app:3000 \
            mcr.microsoft.com/playwright:v1.64.1-noble \
            sh -c "npm ci --no-audit --no-fund && npx playwright test"
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Lowercase owner for GHCR
        run: echo "OWNER_LC=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.OWNER_LC }}/food-os:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    # Gated on e2e as well as build: a failing E2E suite must block production.
    needs: [build, e2e]
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Write SSH key
        run: |
          install -m 0600 /dev/null "$RUNNER_TEMP/deploy_key"
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > "$RUNNER_TEMP/deploy_key"
      - name: Deploy by SHA tag
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i "$RUNNER_TEMP/deploy_key" -o StrictHostKeyChecking=yes "$EC2_USER@$EC2_HOST" \
            "/home/ubuntu/docker/deploy.sh sha-$GITHUB_SHA"
      - name: Public health check
        run: curl -fsS --retry 5 --retry-delay 5 "https://${{ secrets.DOMAIN }}/api/health" | grep -q '"ok":true'
